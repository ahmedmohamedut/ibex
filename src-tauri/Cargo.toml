[package]
name = "ibex"
description = "ibex: browse and export data from iPhone backups"
authors = ["Ahmed Mohamed <ahmedeidx@gmail.com>"]
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ibex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ibex-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }

[dev-dependencies]
ibex-core = { workspace = true, features = ["testutil"] }
# `tauri::test` provides the mock runtime the IPC integration tests drive.
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"


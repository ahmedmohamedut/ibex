name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # 24.04 for libheif >= 1.17 (needed by the v1_17 feature). The packages
    # therefore need glibc 2.39+: Ubuntu 24.04+, Debian 13+, Fedora 40+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libheif-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build .deb and .rpm
        run: scripts/package.sh deb,rpm

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ibex ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm

# ts-rs writes the TypeScript bindings here when `cargo test export_bindings`
# runs. `relative = true` resolves against this file's directory, the workspace
# root, so both ibex-core and src-tauri export to the same place.
# See docs/ARCHITECTURE.md; never edit src/bindings/ by hand.
[env]
TS_RS_EXPORT_DIR = { value = "src/bindings", relative = true }
TS_RS_LARGE_INT = "number"

[package]
name = "ibex-core"
description = "Backup parsing, extractors and exporters for ibex. No UI dependencies."
version.workspace = true
edition.workspace = true
# GPL because of imessage-database; see docs/DATA_SOURCES.md.
license.workspace = true
repository.workspace = true

[features]
# Synthetic backup builder used by tests and by `ibex-cli fixture`.
testutil = []

[dependencies]
aes = "0.9.4"
aes-kw = "0.3.1"
cbc = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
# Writing CSV by hand means getting quoting right for message text full of
# commas, quotes and newlines; this crate already does.
csv = "1.4.0"
filetime = "0.2.29"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# GPL-3.0-or-later. Chosen in M2 for its attributedBody (typedstream) decoding
# and iOS-version schema probing; this is what makes ibex GPL. See
# docs/DATA_SOURCES.md for the decision and its reasoning.
imessage-database = "5.0.1"
infer = { version = "0.22.0", default-features = false }
kamadak-exif = "0.6.2"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
mime_guess = { version = "2.0.5", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
plist = "1.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
# Self-reference so `cargo test -p ibex-core` has the fixture builder available
# without callers needing `--features testutil`.
ibex-core = { path = ".", features = ["testutil"] }
tempfile = "3.27.0"
